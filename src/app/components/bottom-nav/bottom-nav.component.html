<!--
  El rail de escritorio y la barra inferior de móvil listan los MISMOS destinos.
  Lo que cambia es cuántos caben y cómo se enseña el segundo nivel: en escritorio vive
  en la columna de al lado (`app-section-rail`), en móvil dentro de cada pantalla.
-->
@if (viewport.isDesktop()) {
  <nav class="bottom-nav rail" [attr.aria-label]="T().nav_main">
    <div class="rail-brand" aria-hidden="true">
      <app-icon name="dumbbell" [size]="15" />
    </div>

    @for (item of railItems(); track item.path) {
      <a
        class="nav-item rail-item"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        [title]="label(item)"
      >
        <app-icon [name]="item.icon" [size]="19" />
        <span class="nav-label">{{ label(item) }}</span>
      </a>
    }

    <div class="rail-spacer"></div>

    @for (item of railFooterItems(); track item.path) {
      <a
        class="nav-item rail-item"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        [title]="label(item)"
      >
        <app-icon [name]="item.icon" [size]="19" />
        <span class="nav-label">{{ label(item) }}</span>
      </a>
    }

    <!--
      El pliegue solo se ofrece cuando es una ELECCIÓN. Por debajo de 1100px la columna
      se pliega sola y el botón desaparece: un control que no puede cambiar nada miente.
    -->
    @if (!viewport.sectionRailForced()) {
      <button
        class="rail-toggle"
        (click)="viewport.toggleSectionRail()"
        [attr.aria-label]="viewport.sectionRailOpen() ? T().rail_collapse : T().rail_expand"
        [attr.aria-expanded]="viewport.sectionRailOpen()"
        [title]="viewport.sectionRailOpen() ? T().rail_collapse : T().rail_expand"
      >
        <app-icon
          name="chevron"
          [size]="15"
          [class.rail-toggle-icon--open]="viewport.sectionRailOpen()"
        />
      </button>
    }
  </nav>
} @else {
  <nav class="bottom-nav" [attr.aria-label]="T().nav_main">
    @for (item of mobileItems(); track item.path) {
      <a
        class="nav-item"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        [attr.aria-label]="T()[item.key]"
      >
        <app-icon [name]="item.icon" [size]="22" />
        <span class="nav-label">{{ T()[item.key] }}</span>
      </a>
    }
  </nav>
}
